name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $pkg) {
            Write-Error "Tag '${{ github.ref_name }}' does not match package.json version '$pkg'"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package Windows installers
        run: npx electron-builder --win --publish never

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-Item release/PicSmaller-Setup-*.exe, release/PicSmaller-Portable-*.exe).FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "Pic Smaller $tag" --generate-notes
          }

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pic-smaller-windows
          path: |
            release/PicSmaller-Setup-*.exe
            release/PicSmaller-Portable-*.exe
          if-no-files-found: error
