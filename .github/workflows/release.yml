name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win
          - os: ubuntu-latest
            platform: linux
            args: --linux
          - os: macos-latest
            platform: mac
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json').version;const t=process.env.TAG.replace(/^v/,'');if(p!==t){console.error('Tag '+process.env.TAG+' does not match package.json version '+p);process.exit(1)}"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package ${{ matrix.platform }} artifacts
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$version"
          fi
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage release/*.deb release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found in release/" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            target=()
            if [ "${{ github.ref_type }}" != "tag" ]; then
              target=(--target "${{ github.sha }}")
            fi
            gh release create "$tag" "${files[@]}" "${target[@]}" --title "Pic Smaller $tag" --generate-notes
          fi
