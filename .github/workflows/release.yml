name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $pkg) {
            Write-Error "Tag '${{ github.ref_name }}' does not match package.json version '$pkg'"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package Windows installers
        run: npx electron-builder --win --publish never

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
          }
          $files = (Get-Item release/PicSmaller-Setup-*.exe, release/PicSmaller-Portable-*.exe).FullName
          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            $target = @()
            if ("${{ github.ref_type }}" -ne "tag") {
              $target = @("--target", "${{ github.sha }}")
            }
            gh release create $tag $files @target --title "Pic Smaller $tag" --generate-notes
          }
